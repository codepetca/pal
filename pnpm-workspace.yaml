packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for tooling versions shared across packages. Referenced
# as "catalog:" in each package.json, so a bump happens here once instead of
# drifting per package. Only for deps more than one package declares.
catalog:
  eslint: ^9.39.5
  typescript: ^5.8.3
  typescript-eslint: ^8.65.0
